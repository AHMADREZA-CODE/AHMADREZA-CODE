<svg width="100%" viewBox="0 0 900 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Core Focus Areas">
  <defs>
    <linearGradient id="focusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071124" />
      <stop offset="100%" stop-color="#0F294A" />
    </linearGradient>

    <linearGradient id="focusBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="1" />
    </linearGradient>

    <filter id="focusGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="2" y="2" width="896" height="221" rx="12" fill="url(#focusBg)" stroke="#1E3A8A" stroke-width="1.2" />

  
  <rect x="2" y="2" width="896" height="221" rx="12" fill="none" stroke="url(#focusBeamGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="300 1915" filter="url(#focusGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="2215" dur="6.5s" repeatCount="indefinite" />
  </rect>

  
  <text x="36" y="38" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="1.5">
    CORE FOCUS AREAS
  </text>
  <text x="36" y="72" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    • LLMs &amp; GenAI: Prompt Engineering, Embeddings, FAISS/Chroma, RAG, AI Agents (LangChain/LangGraph/Ollama), LoRA
  </text>
  <text x="36" y="102" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    • Deep Learning &amp; NLP: Neural Networks, CNNs, RNN/LSTM/GRU, Transformers, ViT, Diffusion, Multimodal Models
  </text>
  <text x="36" y="132" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    • Computer Vision: OpenCV Image Processing, YOLO Object Detection, Segmentation (U-Net, Mask R-CNN, SAM)
  </text>
  <text x="36" y="162" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    • Machine Learning &amp; Data: Supervised/Unsupervised ML, Feature Engineering, PCA, Time Series, Recommenders, ETL
  </text>
  <text x="36" y="192" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    • Software &amp; MLOps: Python, OOP, SQL &amp; NoSQL (PostgreSQL, MySQL, MongoDB, SQLite), Django REST, Flask, Docker, Git
  </text>
</svg>
