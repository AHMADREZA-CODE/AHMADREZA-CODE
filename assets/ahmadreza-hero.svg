<svg width="100%" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ahmadreza Ghasemi - Computer Science and AI Engineer Banner">
  <defs>
    <linearGradient id="bgGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="55%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0F294A" />
    </linearGradient>

    <linearGradient id="glowLineBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="techGridBlue" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E3A8A" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>

    <filter id="softGlowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect width="900" height="240" rx="14" fill="url(#bgGradBlue)" />
  <rect width="900" height="240" rx="14" fill="url(#techGridBlue)" />

  
  <circle cx="770" cy="120" r="78" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.28" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate" from="0 770 120" to="360 770 120" dur="36s" repeatCount="indefinite" />
  </circle>
  <circle cx="770" cy="120" r="46" fill="none" stroke="#60A5FA" stroke-width="1.4" stroke-opacity="0.45" />
  <circle cx="770" cy="120" r="10" fill="#3B82F6" filter="url(#softGlowBlue)" />

  
  <path d="M 52 178 Q 220 142 390 176 T 720 165" fill="none" stroke="url(#glowLineBlue)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,1200;700,1200;1200,1200" dur="4s" repeatCount="indefinite" />
  </path>

  
  <text x="52" y="72" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="2.5">
    COMPUTER SCIENCE UNDERGRADUATE • ASPIRING AI ENGINEER
  </text>

  <text x="52" y="118" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="700" letter-spacing="0.5">
    Ahmadreza Ghasemi
  </text>

  <text x="52" y="150" fill="#CBD5E1" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16">
    LLMs &amp; GenAI • Deep Learning • Machine Learning • Computer Vision (OpenCV)
  </text>

  
  <rect x="52" y="192" width="175" height="24" rx="12" fill="#0F294A" stroke="#2563EB" stroke-width="1" />
  <text x="140" y="208" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="11">
    M.Sc. AI Target • Python &amp; PyTorch
  </text>
</svg>
